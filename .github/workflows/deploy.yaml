name: Build packages and images

on:
  push:
    branches: [main]

jobs:
  build-core-python-packages:
    permissions:
      contents: write
    strategy:
      matrix:
        package: [core]
    uses: ./.github/workflows/build-wheel.yaml
    with:
      package-path: ${{ matrix.package }}

  build-dependent-python-packages:
    needs: build-core-python-packages
    permissions:
      contents: write
    strategy:
      matrix:
        package: [api]
    uses: ./.github/workflows/build-wheel.yaml
    with:
      package-path: ${{ matrix.package }}

  # Images build from the workspace source, so they don't wait on the wheels.
  build-api-image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      version-file: docker/api/pyproject.toml
      dockerfile: docker/api/Dockerfile

  build-ui-image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      version-file: frontend/package.json
      dockerfile: frontend/Dockerfile
      context: frontend
